<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>ELECTRODIVE 12</title>
<meta name="description" content="ELECTRODIVE 12 official website">
<meta property="og:title" content="ELECTRODIVE 12">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gf" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link id="gfp" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* VOICE: 담백하고 단단하게. 사진과 글씨만으로
   IDEA: 라이브하우스 벽에 붙은 흑백 공연 전단, 앨범 속지의 크레딧
   PICTURE: 메인 사진을 화면 끝까지. 사진이 없으면 아주 큰 밴드 이름 글자
   COLOUR and TYPE: 검정 바탕, 흰 글씨, 형광 라임은 NEXT 표시와 편집 버튼에만 / Archivo + Noto Sans KR
   LAYOUT: 위에 고정 메뉴, 섹션은 넓은 여백과 가는 선으로 나눔 */
:root{color-scheme:dark;--bg:#0a0a0a;--ink:#f3f3f1;--ink2:#cfcfcd;--sub:#8e8e8e;--line:#262626;--line2:#3a3a3a;--card:#141414;--acc:#d7ff3a;--acc-ink:#0a0a0a;
  --fh:var(--fh);--fb:var(--fb);--hw:800;--lw:600}
:root[data-theme=light]{color-scheme:light;--bg:#fafaf8;--ink:#121212;--ink2:#3a3a3a;--sub:#6e6e6e;--line:#e3e3df;--line2:#c9c9c4;--card:#efefeb}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 var(--fb);overflow-x:clip;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.en{font-family:var(--fh)}
.wrap{max-width:1100px;margin:0 auto;padding:0 max(5vw,20px)}
.sub{color:var(--sub)}
[hidden]{display:none!important}

/* 메뉴 */
header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.logo{font:var(--hw) 19px/1 var(--fh);letter-spacing:.02em;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.menu{display:flex;gap:2px}
nav.menu a{font:var(--lw) 13px/1 var(--fh);letter-spacing:.08em;text-decoration:none;padding:12px 10px;color:var(--sub);white-space:nowrap}
nav.menu a:hover,nav.menu a[aria-current=page]{color:var(--ink)}
.burger{display:none;width:44px;height:44px;border:0;background:none;padding:10px;cursor:pointer}
.burger i{display:block;height:2px;background:var(--ink);margin:6px 0;transition:transform .2s}
@media(max-width:860px){
  .burger{display:block}
  nav.menu{position:fixed;inset:calc(65px + env(safe-area-inset-top)) 0 0;background:var(--bg);flex-direction:column;padding:24px max(5vw,20px);gap:0;display:none}
  body.mo nav.menu{display:flex}
  nav.menu a{font-size:30px;font-weight:800;padding:14px 0;border-bottom:1px solid var(--line);letter-spacing:.02em}
  body.mo .burger i:first-child{transform:translateY(4px) rotate(45deg)}body.mo .burger i:last-child{transform:translateY(-4px) rotate(-45deg)}
}

/* 메인 */
.hero{position:relative;min-height:min(80vh,760px);display:grid;align-items:end;background:#000;color:#f3f3f1;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% var(--fy,50%)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,.1) 55%)}
.hero .t{position:relative;z-index:1;width:100%;padding-bottom:clamp(32px,6vw,72px)}
.hero h1{font:var(--hw) calc(clamp(40px,9.5vw,128px)*var(--hs,1))/.9 var(--fh);margin:0;letter-spacing:-.02em;text-wrap:balance;word-break:keep-all;overflow-wrap:normal}
.hero p{margin:18px 0 0;font-size:clamp(16px,2vw,20px);max-width:36em}
.hero[data-fit] h1{white-space:nowrap;text-wrap:nowrap}
.hero[data-tp=top]{align-items:start}
.hero[data-tp=top] .t{padding-top:clamp(28px,5vw,64px);padding-bottom:0}
.hero[data-tp=top]::after{background:linear-gradient(to bottom,rgba(0,0,0,.8),rgba(0,0,0,.05) 50%)}
.hero[data-tp=below]{display:block;min-height:0;background:var(--bg);color:var(--ink)}
.hero[data-tp=below] img{position:static;display:block;height:auto;max-height:min(78vh,760px)}
.hero[data-tp=below]::after{display:none}
.hero[data-tp=below] .t{padding-top:clamp(24px,4vw,48px)}
.hero[data-al=center] .t{text-align:center}.hero[data-al=center] p{margin-left:auto;margin-right:auto}
.sec{padding:clamp(48px,7vw,88px) 0;border-top:1px solid var(--line)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:20px}
.sec-h h2{font:var(--hw) clamp(28px,4vw,44px)/1 var(--fh);margin:0}
.more{font:var(--lw) 13px/1 var(--fh);letter-spacing:.08em;color:var(--sub);text-decoration:none;white-space:nowrap;padding:10px 0}
.more:hover{color:var(--ink)}

/* 하위 페이지 머리 */
.ph{padding-top:clamp(40px,7vw,80px);padding-bottom:clamp(20px,3vw,32px)}
.ph h1{font:var(--hw) clamp(44px,8vw,96px)/.95 var(--fh);margin:0;letter-spacing:-.01em}
.ph .row{margin-top:20px}
.pbody{padding-bottom:clamp(56px,8vw,100px)}
.back{display:inline-block;margin:28px 0 0;font:var(--lw) 13px/1 var(--fh);letter-spacing:.08em;color:var(--sub);text-decoration:none;padding:10px 0}

/* NEWS 목록 */
.nrow{display:grid;grid-template-columns:130px minmax(0,1fr);gap:20px;padding:20px 0;border-bottom:1px solid var(--line);text-decoration:none;align-items:baseline}
.nrow:first-child{border-top:1px solid var(--line)}
.nrow:hover .nt{text-decoration:underline;text-underline-offset:4px}
.dt{font:var(--lw) 14px/1.4 var(--fh);color:var(--sub);white-space:nowrap}
.tag{display:inline-block;font-size:13px;color:var(--sub);margin-right:8px;white-space:nowrap}
.tag::before{content:"【"}.tag::after{content:"】"}

/* LIVE 목록 */
.lrow{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:20px;padding:22px 0;border-bottom:1px solid var(--line);text-decoration:none;align-items:center}
.lrow:first-child{border-top:1px solid var(--line)}
.lrow:hover h3{text-decoration:underline;text-underline-offset:4px}
.ld b{display:block;font:var(--hw) 34px/1 var(--fh)}
.ld span{font:var(--lw) 12px/1 var(--fh);letter-spacing:.08em;color:var(--sub)}
.li h3{margin:0;font-size:18px;font-weight:700;line-height:1.4}
.li p{margin:4px 0 0;font-size:14px}
.lm{font:var(--lw) 11px/1 var(--fh);letter-spacing:.1em;color:var(--sub);display:flex;gap:8px;white-space:nowrap}
.nx{font-style:normal;background:var(--acc);color:var(--acc-ink);padding:5px 8px}
.rec{border:1px solid var(--line);padding:4px 7px}
.tabs{display:flex;gap:4px;margin-bottom:24px;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{font:var(--lw) 13px/1 var(--fh);letter-spacing:.08em;text-decoration:none;color:var(--sub);padding:14px 12px 13px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a[aria-current=page]{color:var(--ink);border-color:var(--ink)}

/* 달력 */
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.calh b{font:var(--hw) 26px/1 var(--fh)}
.calh button{width:44px;height:44px;border:1px solid var(--line);background:none;font-size:18px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line)}
.cal>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:104px;padding:6px 8px;display:flex;flex-direction:column;gap:4px}
.cal .wd{min-height:auto;font:var(--lw) 11px/1 var(--fh);letter-spacing:.08em;color:var(--sub);padding:10px 8px}
.cal .dn{font:var(--lw) 13px/1 var(--fh);color:var(--sub)}
.cal .today .dn{color:var(--bg);background:var(--ink);align-self:flex-start;padding:3px 5px}
.cal .emp{background:color-mix(in srgb,var(--line) 30%,transparent)}
.ce{font-size:12px;line-height:1.35;background:var(--ink);color:var(--bg);padding:4px 6px;text-decoration:none;font-weight:700;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.calm{margin-top:28px}

/* 상세 글 */
.art{max-width:760px}
.art h1{font-size:clamp(26px,4vw,38px);line-height:1.3;margin:10px 0 0;text-wrap:balance}
.body{white-space:pre-wrap;overflow-wrap:anywhere;margin:28px 0 0}
.body a{text-decoration:underline;text-underline-offset:3px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:8px;margin-top:28px}
.pg a{display:block;aspect-ratio:4/3;background:var(--card);overflow:hidden}
.pg img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .2s}
.pg a:hover img{opacity:.85}
.blk{margin-top:48px}
.blk h2{font:var(--hw) 20px/1 var(--fh);letter-spacing:.06em;margin:0 0 16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.set{margin:0;padding-left:2.2em;font-size:17px;line-height:2}
.set li::marker{font-family:var(--fh);color:var(--sub)}
.yt{display:grid;gap:16px}
.yt iframe{width:100%;aspect-ratio:16/9;border:0;background:#000;display:block}
.ldt{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.ldt b{font:var(--hw) clamp(40px,7vw,72px)/1 var(--fh)}
.facts{margin:24px 0 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 24px}
.facts dt{font:var(--lw) 12px/1.9 var(--fh);letter-spacing:.1em;color:var(--sub)}
.facts dd{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font:var(--lw) 14px/1 var(--fh);letter-spacing:.06em;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn.ol{background:transparent;color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* 멤버, 앨범 */
.about{max-width:760px;font-size:17px;white-space:pre-wrap}
.ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:40px 24px;margin-top:24px}
.ppl figure{margin:0}
.ppl .im{aspect-ratio:4/5;background:var(--card);overflow:hidden;display:grid;place-items:center}
.ppl img{width:100%;height:100%;object-fit:cover}
.ppl .im span{font:var(--hw) 64px/1 var(--fh);color:var(--line2)}
.ppl h3{margin:14px 0 0;font-size:20px}
.ppl .pt{font:var(--lw) 12px/1.6 var(--fh);letter-spacing:.1em;color:var(--sub)}
.ppl p{margin:8px 0 0;font-size:15px;white-space:pre-wrap;color:var(--ink2)}
.hid{font-size:12px;border:1px dashed #9bbf00;color:var(--ink);padding:2px 6px;margin-left:6px;vertical-align:middle}
.disc{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:36px 24px}
.disc a{text-decoration:none}
.cv{aspect-ratio:1;background:var(--card);overflow:hidden;display:grid;place-items:center}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv span{font:var(--hw) 28px/1.1 var(--fh);color:var(--line2);padding:16px;text-align:center}
.disc h3{margin:12px 0 0;font-size:17px;line-height:1.4}
.disc a:hover h3{text-decoration:underline;text-underline-offset:4px}
.alb{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(24px,5vw,64px);align-items:start}
.alb h1{font-size:clamp(28px,4vw,44px);line-height:1.2;margin:8px 0 0}
.adesc{margin-top:28px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;line-height:1.85;color:var(--ink2);max-width:38em}
.adesc a{text-decoration:underline;text-underline-offset:3px}
.trk{margin:0;padding-left:2.2em;font-size:16px;line-height:2.1}
.rel{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:28px;align-items:end;text-decoration:none}
.rel h3{font-size:clamp(22px,3vw,30px);margin:6px 0 0;line-height:1.3}

/* CONTACT */
.mail{font:var(--hw) clamp(22px,4.4vw,44px)/1.2 var(--fh);overflow-wrap:anywhere;text-decoration:none;display:inline-block;margin:8px 0 20px}
.mail:hover{text-decoration:underline;text-underline-offset:6px}
.sns{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}

footer{border-top:1px solid var(--line);padding:40px 0 calc(40px + env(safe-area-inset-bottom));font-size:13px;color:var(--sub)}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px 28px;justify-content:space-between;align-items:center}
footer a{text-decoration:none;font:var(--lw) 12px/1 var(--fh);letter-spacing:.1em;padding:8px 0}
footer a:hover{color:var(--ink)}
.empty{color:var(--sub);padding:28px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

/* 편집 */
.eb{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border:1px dashed #9bbf00;background:color-mix(in srgb,#d7ff3a 12%,transparent);color:var(--ink);font:600 13px/1 var(--fb);cursor:pointer;white-space:nowrap;margin:0 6px 6px 0}
.ebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:40;background:#d7ff3a;color:#0a0a0a;display:flex;align-items:center;gap:6px;padding:6px 6px 6px 16px;font-size:13px;font-weight:700;white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.ebar button{border:0;background:#0a0a0a;color:#d7ff3a;font-weight:700;font-size:12px;min-height:34px;padding:0 10px;cursor:pointer}
dialog{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0;width:min(680px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(0,0,0,.75)}
dialog.side{margin:0 0 0 auto;height:100dvh;max-height:100dvh;width:min(460px,100vw);border-width:0 0 0 1px}
dialog.side::backdrop{background:rgba(0,0,0,.2)}
.rng{display:flex;align-items:center;gap:12px}.rng input{flex:1;accent-color:var(--ink);height:44px}.rng b{min-width:3.5em;text-align:right;font-variant-numeric:tabular-nums}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.dh h2{margin:0;font-size:18px}
.x{width:44px;height:44px;border:0;background:none;font-size:22px;cursor:pointer}
.fb{padding:20px;display:flex;flex-direction:column;gap:16px}
.fl{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
.fl small{color:var(--sub);font-weight:400}
.fl input:not([type=checkbox]):not([type=file]),.fl select,.fl textarea{min-height:46px;background:var(--bg);border:1px solid var(--line2);padding:10px 12px;font-size:16px;font-weight:400;width:100%}
.fl textarea{min-height:120px;resize:vertical;line-height:1.6}
.fl.ck{flex-direction:row;align-items:center;gap:10px}
.fl.ck input{width:22px;height:22px;accent-color:var(--acc)}
.th{display:flex;gap:8px;flex-wrap:wrap}
.th div{position:relative;width:88px;height:88px;background:var(--bg);overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.th button{position:absolute;right:3px;top:3px;width:28px;height:28px;border:0;border-radius:50%;background:rgba(0,0,0,.75);color:#fff;cursor:pointer}
.ferr{color:#ff8a80;margin:0;font-size:14px;min-height:1.2em}
.del.arm{background:#d6372b;border-color:#d6372b;color:#fff}
.dz h3{margin:6px 0 0;font-size:15px}
.dz .sm{font-size:13px;color:var(--sub);margin:0}
.fo{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:8px}
.fo label{display:block;border:1px solid var(--line2);padding:12px;cursor:pointer;position:relative}
.fo input{position:absolute;opacity:0}
.fo label:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.fo label:has(input:focus-visible){outline:2px solid #d7ff3a;outline-offset:2px}
.fo .pv{display:block;font-size:24px;line-height:1.15;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fo .pvb{display:block;font-size:15px;line-height:1.5}
.fo small{display:block;margin-top:6px;font:12px/1.3 system-ui,sans-serif;color:var(--sub)}
.sw{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw label{width:44px;height:44px;border:1px solid var(--line2);cursor:pointer;position:relative;display:block}
.sw input{position:absolute;opacity:0}
.sw label:has(input:checked){outline:2px solid var(--ink);outline-offset:2px}
.sw input[type=color]{position:static;opacity:1;width:44px;height:44px;border:1px solid var(--line2);background:none;padding:2px;cursor:pointer}
.seg{display:flex;gap:8px}.seg label{flex:1;border:1px solid var(--line2);padding:12px;text-align:center;cursor:pointer}
.seg input{position:absolute;opacity:0}.seg label:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.gate{max-width:420px;display:flex;flex-direction:column;gap:14px}
.gate input{min-height:52px;background:var(--card);border:1px solid var(--line2);padding:0 16px;font-size:18px}
@media(max-width:600px){
  .nrow{grid-template-columns:minmax(0,1fr);gap:4px;padding:16px 0}
  .lrow{grid-template-columns:76px minmax(0,1fr);gap:14px;padding:18px 0}
  .lrow .lm{grid-column:2}
  .ld b{font-size:26px}
  .cal>div{min-height:54px;padding:4px}
  .cal .wd{padding:8px 2px;text-align:center;font-size:10px}
  .cal .dn{font-size:12px}
  .ce{font-size:0;padding:0;height:6px;background:var(--acc)}
  .alb,.rel{grid-template-columns:minmax(0,1fr)}
  .rel .cv{max-width:260px}
  .facts{grid-template-columns:minmax(0,1fr);gap:0}
  .facts dd{margin-bottom:10px}
  dialog{width:100%;max-width:100%;margin:auto 0 0;max-height:92dvh}
  dialog.side{height:auto;max-height:58dvh;border-width:1px 0 0}
  .ppl,.disc{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 14px}
  .fo{grid-template-columns:repeat(2,minmax(0,1fr))}.fo .pv{font-size:18px}.fo .pvb{font-size:13px}.fo label{padding:10px}
  .ppl h3{font-size:17px}.ppl p{font-size:14px}.disc h3{font-size:15px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<header class="top">

<script>
{

function inkOn(hex){const n=parseInt(hex.slice(1),16),c=[n>>16,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});
  return .2126*c[0]+.7152*c[1]+.0722*c[2]>.35?'#0a0a0a':'#ffffff'}
let DZ={};
function fitHero(){
  const h=document.querySelector('.hero h1');if(!h)return;const hero=h.closest('.hero'),auto=!(+DZ.hero_size);
  hero.toggleAttribute('data-fit',auto);hero.dataset.al=DZ.hero_align==='center'?'center':'left';hero.dataset.tp=['top','below'].includes(DZ.hero_text)?DZ.hero_text:'bottom';h.style.marginLeft='';

/* ---------- 편집 버튼 ---------- */
const eNew=(k,label)=>editOn?`<button class="eb" data-new="${k}">${label}</button>`:'';
const eEdit=(k,id,label='수정')=>editOn?`<button class="eb" data-edit="${k}" data-id="${esc(id||'')}">${label}</button>`:'';
const empty=t=>`<p class="empty">${t}</p>`;

/* ---------- 공통 조각 ---------- */
function newsRows(list){return list.map(n=>`<a class="nrow" href="#/news/${n.id}"><span class="dt">${D(n.posted_on)?.full||''}</span><span>${n.tag?`<span class="tag">${esc(n.tag)}</span>`:''}<span class="nt">${esc(n.title)}</span></span></a>`).join('')}
function hasRec(l){return l.diary||l.photos?.length||l.youtube?.length||l.setlist?.length}
function liveRows(list,markNext){const t=today();let first=true;return list.map(l=>{const d=D(l.date);const nx=markNext&&first&&l.date>=t;if(l.date>=t)first=false;
  return `<a class="lrow" href="#/live/${l.id}"><div class="ld"><b>${d.m}.${d.d}</b><span>${d.w} · ${d.y}</span></div>
  <div class="li"><h3>${esc(l.title)}</h3><p class="sub">${[l.venue,l.time].filter(Boolean).map(esc).join(' · ')}</p></div>
  <span class="lm">${nx?'<i class="nx">NEXT</i>':''}${hasRec(l)?'<span class="rec">REPORT</span>':''}</span></a>`}).join('')}
const cover=a=>`<div class="cv">${a.cover?`<img src="${esc(pub(a.cover))}" alt="${esc(a.title)} 자켓" loading="lazy">`:`<span>${esc(a.title)}</span>`}</div>`;
const photos=arr=>arr?.length?`<div class="pg">${arr.map(p=>`<a href="${esc(pub(p))}" target="_blank" rel="noopener"><img src="${esc(pub(p))}" alt="" loading="lazy"></a>`).join('')}</div>`:'';
const head=(t,extra='')=>`<div class="wrap ph"><h1>${t}</h1>${extra?`<div class="row">${extra}</div>`:''}</div>`;

function pLive(id){
  if(id&&!['past','calendar'].includes(id))return pLiveOne(id);
  const tab=id||'upcoming',t=today();
  const tabs=`<nav class="tabs">${[['upcoming','UPCOMING','#/live'],['past','PAST','#/live/past'],['calendar','CALENDAR','#/live/calendar']].map(([k,l,h])=>`<a href="${h}" ${k===tab?'aria-current="page"':''}>${l}</a>`).join('')}</nav>`;
  let body='';
  if(tab==='upcoming')body=liveRows(S.lives.filter(l=>l.date>=t),true)||empty('예정된 공연이 없어요.');
  else if(tab==='past')body=liveRows(S.lives.filter(l=>l.date<t).reverse())||empty('아직 지난 공연 기록이 없어요.');
  else body=calendar();
  app.innerHTML=head('LIVE',eNew('live','+ 새 공연'))+`<div class="wrap pbody">${tabs}${body}</div>`;
  return 'LIVE';
}
function calendar(){
  if(!calM){const d=new Date();calM={y:d.getFullYear(),m:d.getMonth()}}
  const {y,m}=calM,first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),t=today();
  const key=d=>`${y}-${pad(m+1)}-${pad(d)}`;
  const cells=[];for(let i=0;i<first;i++)cells.push('<div class="emp"></div>');
  for(let d=1;d<=days;d++){const ls_=S.lives.filter(l=>l.date===key(d));
    cells.push(`<div class="${key(d)===t?'today':''}"><span class="dn">${d}</span>${ls_.map(l=>`<a class="ce" href="#/live/${l.id}" title="${esc(l.title)}">${esc(l.title)}</a>`).join('')}</div>`)}

function drawPics(name){

  box.querySelector('input[type=file]').hidden=arr.length+(+box.dataset.up||0)>=max;
  $('#fSave').disabled=[...document.querySelectorAll('[data-pf]')].some(b=>+b.dataset.up>0);

function shrink(file,max=1800){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(u);cv.toBlob(b=>b?res(b):rej(),'image/jpeg',.86)};
  img.onerror=()=>{URL.revokeObjectURL(u);rej()};img.src=u})}
$('#dBody').addEventListener('change',async e=>{
  if(e.target.type!=='file')return;const box=e.target.closest('[data-pf]'),name=box.dataset.pf,max=+box.dataset.max;

  for(const f of files){box.dataset.up=(+box.dataset.up||0)+1;drawPics(name);
    try{const b=await shrink(f),path=`${me}/${crypto.randomUUID()}.jpg`;
      const {error}=await sb.storage.from('hp').upload(path,b,{contentType:'image/jpeg'});if(error)throw error;
      F.pics[name].push(path);F.fresh.push(path)}catch(err){$('#fErr').textContent='사진을 올리지 못했어요. (5MB 이하 이미지만 가능)'}

$('#frm').addEventListener('submit',async e=>{

    else if(type==='links')data[name]=el.value.split('\n').map(s=>{const i=s.lastIndexOf('|');const lb=i<0?'':s.slice(0,i).trim(),u=(i<0?s:s.slice(i+1)).trim();return {label:lb||u.replace(/^https?:\/\/(www\.)?/,'').split('/')[0],url:u}}).filter(x=>safeUrl(x.url));

      data[name]=type==='date'?(v||null):v}}

  const {data:out,error}=await q.select();
  if(error||!out?.length){$('#fSave').disabled=false;$('#fErr').textContent='저장하지 못했어요. 편집 권한이 풀렸다면 맨 아래 EDIT로 다시 들어와 주세요.';return}
  F.saved=true;
  if(F.row){const keep=new Set(sp.f.filter(f=>f[2].startsWith('photo')).flatMap(f=>F.pics[f[0]]));
    const gone=sp.f.filter(f=>f[2].startsWith('photo')).flatMap(f=>[].concat(F.row[f[0]]||[])).filter(p=>p&&!keep.has(p));if(gone.length)sb.storage.from('hp').remove(gone)}
  $('#dlg').close();await load();
  const go={news:'#/news/',live:'#/live/',album:'#/discography/'}[F.k];
  if(!F.row&&go)location.hash=go+out[0].id;else route(true);
});
$('#dlg').addEventListener('close',()=>{if(F&&!F.saved&&F.fresh.length)sb.storage.from('hp').remove(F.fresh);if(F?.k==='settings'&&!F.saved)route(true)});
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-close]');if(c){c.closest('dialog').close();return}
  const n=e.target.closest('[data-new]');if(n){openForm(n.dataset.new);return}
  if(e.target.closest('[data-design]')){openDesign();return}
  const d=e.target.closest('[data-edit]');if(d){openForm(d.dataset.edit,d.dataset.edit==='settings'?1:d.dataset.id)}});
$('#eDesign').addEventListener('click',openDesign);
$('#eOff').addEventListener('click',()=>{editOn=false;ls.set('hpEdit','0');route(true)});
$('#eCode').addEventListener('click',async()=>{
  F={k:null,fresh:[],saved:true};
  $('#dTitle').textContent='편집 코드 바꾸기';
  $('#dBody').innerHTML=`<label class="fl">새 편집 코드<small>6자 이상. 바꾸면 다른 기기에서 처음 들어올 때 새 코드를 써야 해요. 이미 편집자인 브라우저는 그대로예요.</small><input id="nCode" type="password" autocomplete="new-password" minlength="6"></label>
    <p class="ferr" id="fErr"></p><div class="row" style="justify-content:flex-end"><button type="button" class="btn ol" data-close>취소</button><button type="button" class="btn" id="nSave">바꾸기</button></div>`;
  $('#dlg').showModal();
  $('#nSave').addEventListener('click',async()=>{const v=$('#nCode').value.trim();if(v.length<6){$('#fErr').textContent='6자 이상으로 정해주세요.';return}
    const {error}=await sb.rpc('hp_set_code',{code:v});if(error){$('#fErr').textContent='바꾸지 못했어요.';return}$('#dlg').close()});
});

/* ---------- 시작 ---------- */
(async()=>{
  if(!window.supabase){app.innerHTML=head('ERROR')+`<div class="wrap pbody"><p class="sub">필요한 파일을 불러오지 못했어요. 새로고침 해주세요.</p></div>`;return}
  sb=window.supabase.createClient(SUPABASE_URL.trim(),SUPABASE_KEY.trim());
  try{const {data:{session}}=await sb.auth.getSession();
    if(session){me=session.user.id;const {data}=await sb.rpc('hp_is_editor');editor=!!data;editOn=editor&&ls.get('hpEdit')!=='0'}}catch(e){}
  if(await load())route(false);
})();
}
</script>
</body>
</html>
